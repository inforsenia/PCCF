services:
  pccf:
    container_name: pccf
    build: .
    user: "1000:1000"
    volumes:
      - ../PCCF:/home/PCCF
      # Carpeta sincronitzada d'OneDrive (memòries de departament) -- mateix path
      # absolut dins i fora del contenidor. A diferència de Portainer (on
      # l'entrypoint crea els symlinks memories_* dins del contenidor cada
      # vegada), ací els symlinks ja existeixen sobre l'amfitrió i s'usen
      # tant en directe com des del contenidor -- el path ha de coincidir
      # amb el real de l'amfitrió, no pot ser un path "net" inventat.
      - /media/DADES/OneDriveGVA-Memories:/media/DADES/OneDriveGVA-Memories
    # Por defecto, mantener el contenedor vivo para modo detached
    command: tail -f /dev/null
    # Variables de entorno útiles
    environment:
      - TERM=xterm-256color
      - TZ=Europe/Madrid
    # Configuración TTY para modo interactivo
    tty: true
    stdin_open: true
